<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        body {
            text-align: center;
        }

        /* Some basic styling for demonstration purposes */
        #contactForm {
            max-width: 400px;
            margin: 0 auto;
        }

        #contactForm input,
        #contactForm textarea {
            width: 100%;
            margin-bottom: 15px;
            padding: 8px;
        }

        #contactForm button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #contactForm button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <nav>
        <h1>Travel Bloom</h1>
        <ul>
            <li><a href="index.html" id="home">Home </a></li>
            <li><a href="./about.html" id="about">About Us </a></li>
            <li><a href="./contact.html" id="contact">Contact Us </a></li>
            <li><input type="text" id="conditionInput" placeholder="Enter a destionation or keyword"> </li>
            <li><button id='btnSearch'>Search</button>
            <li><button id='btnClear'>Clear</button>
            </li>
        </ul>
    </nav>
    <div>
        <h1 style="color: white;">Contact Us</h1>

        <p style="color: white;">Feel free to contact us to know more about recommendations.
        </p>

        <div style="margin-top: 20px;">

            <form style="opacity: 0.8" id="contactForm">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" onclick="thankyou()">Submit</button>
            </form>
        </div>

    </div>


    <script>
        function thankyou() {
            alert('Thank you for contacting us!')
        }
    </script>
</body>

</html>
